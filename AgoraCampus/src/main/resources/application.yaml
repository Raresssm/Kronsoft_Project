spring:
  application:
    name: AgoraCampus

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agora_campus}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/agora-campus}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/agora-campus/protocol/openid-connect/certs}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8090}
  realm: ${KEYCLOAK_REALM:agora-campus}
  admin:
    username: ${KEYCLOAK_ADMIN:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    oauth:
      client-id: ${KEYCLOAK_SWAGGER_CLIENT_ID:agora-swagger-ui}
      scopes:
        - openid
        - profile
      use-pkce-with-authorization-code-grant: true
